<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="monitorScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="tabletScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#99c1f1"/>
      <stop offset="0.55" stop-color="#7a6ff0"/>
      <stop offset="1" stop-color="#9141ac"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c0bfbc"/>
    </linearGradient>
  </defs>

  <!-- PC monitor, behind -->
  <rect x="38" y="104" width="22" height="6" rx="2" fill="#77767b"/>
  <rect x="44" y="90" width="10" height="16" fill="#9a9996"/>
  <rect x="6" y="20" width="86" height="72" rx="8" fill="url(#bezel)"/>
  <rect x="11" y="25" width="76" height="58" rx="4" fill="url(#monitorScreen)"/>
  <rect x="17" y="31" width="30" height="20" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="17" y="31" width="30" height="5" rx="2" fill="#deddda"/>


  <!-- Tablet, in front -->
  <rect x="40" y="50" width="84" height="60" rx="9" fill="#000000" opacity="0.18" transform="translate(1 3)"/>
  <rect x="40" y="50" width="84" height="60" rx="9" fill="url(#bezel)"/>
  <rect x="45" y="55" width="74" height="50" rx="5" fill="url(#tabletScreen)"/>
  <rect x="52" y="62" width="34" height="24" rx="3" fill="#ffffff" opacity="0.92"/>
  <rect x="52" y="62" width="34" height="6" rx="2" fill="#deddda"/>
  <rect x="91" y="70" width="22" height="16" rx="3" fill="#ffffff" opacity="0.55"/>
  <path d="M56 94 q10 -10 20 0 t20 0" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- S Pen -->
  <g transform="rotate(-40 100 104)">
    <rect x="78" y="100" width="44" height="8" rx="4" fill="url(#pen)"/>
    <rect x="100" y="100" width="4" height="8" fill="#9a9996"/>
    <path d="M78 100 l-8 4 l8 4 z" fill="#5e5c64"/>
  </g>

  <!-- "+1" badge -->
  <circle cx="106" cy="28" r="19" fill="#000000" opacity="0.15" transform="translate(0 2)"/>
  <circle cx="106" cy="28" r="19" fill="#2ec27e"/>
  <circle cx="106" cy="28" r="19" fill="none" stroke="#26a269" stroke-width="2"/>
  <rect x="91" y="26" width="14" height="4.5" rx="2" fill="#ffffff"/>
  <rect x="95.75" y="21.25" width="4.5" height="14" rx="2" fill="#ffffff"/>
  <path d="M110 22 l4.5 -3.5 h1.5 v19.5 h-4.5 v-13 l-1.5 1.2 z" fill="#ffffff"/>
</svg>
